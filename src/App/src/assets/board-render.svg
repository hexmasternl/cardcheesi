<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f2a4a"/>
      <stop offset="60%" stop-color="#0b1e3a"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>

    <!-- Board surface gradient (3D top-light illusion) -->
    <linearGradient id="boardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="50%" stop-color="#12294a"/>
      <stop offset="100%" stop-color="#0a1e35"/>
    </linearGradient>

    <!-- Track tile normal -->
    <linearGradient id="trackTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4068"/>
      <stop offset="100%" stop-color="#142d4a"/>
    </linearGradient>

    <!-- Player home gradients -->
    <radialGradient id="homeP1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="homeP2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="homeP3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6bff9e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00aa44" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="homeP4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cc8800" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Glow filter for center -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Board shadow -->
    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Subtle ambient glow -->
    <filter id="ambient">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Track highlight gradient -->
    <linearGradient id="trackHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Center tile gradient -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#009ccc" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0052cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#001e29" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Perspective transform for 3D tilt -->
    <style>
      .board-group { transform-origin: 960px 540px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ambient light spots -->
  <ellipse cx="960" cy="400" rx="500" ry="300" fill="#009ccc" opacity="0.04"/>
  <ellipse cx="300" cy="800" rx="300" ry="200" fill="#0052cc" opacity="0.05"/>
  <ellipse cx="1600" cy="200" rx="250" ry="180" fill="#009ccc" opacity="0.04"/>

  <!-- Star field -->
  <g opacity="0.4">
    <circle cx="120" cy="80" r="1" fill="white" opacity="0.6"/>
    <circle cx="350" cy="150" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="700" cy="60" r="1" fill="white" opacity="0.7"/>
    <circle cx="1100" cy="90" r="1" fill="white" opacity="0.5"/>
    <circle cx="1450" cy="45" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="1750" cy="120" r="1" fill="white" opacity="0.6"/>
    <circle cx="80" cy="300" r="1" fill="white" opacity="0.5"/>
    <circle cx="1850" cy="350" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="200" cy="950" r="1" fill="white" opacity="0.6"/>
    <circle cx="1800" cy="900" r="1" fill="white" opacity="0.5"/>
    <circle cx="500" cy="1020" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="1600" cy="1050" r="1" fill="white" opacity="0.6"/>
  </g>

  <!-- Board group - slightly tilted for 3D perspective feel -->
  <g transform="translate(960,560) scale(1,0.88) rotate(-4) translate(-960,-560)" filter="url(#boardShadow)">

    <!-- Board base plate -->
    <rect x="385" y="115" width="1190" height="860" rx="24" fill="url(#boardSurface)" stroke="#1e4a7a" stroke-width="2"/>

    <!-- ═══════════════════════════════════════════════
         BOARD GRID (15×15 Parcheesi layout, simplified)
         Each tile = 56px, board = 840px, start at (540, 120)
         ═══════════════════════════════════════════════ -->

    <!-- Track tiles - outer ring (simplified as rectangles forming a cross shape) -->
    <!-- We'll draw the board as a stylised top-down Parcheesi board -->

    <!-- Board background (inner) -->
    <rect x="420" y="130" width="1120" height="800" rx="16" fill="#0e2240" stroke="#1a3a65" stroke-width="1.5"/>

    <!-- The cross-shaped board track area -->
    <!-- Vertical track (center column) -->
    <rect x="710" y="130" width="500" height="800" rx="8" fill="#112845"/>
    <!-- Horizontal track (center row) -->
    <rect x="420" y="370" width="1120" height="340" rx="8" fill="#112845"/>

    <!-- Player home areas (corner squares) -->
    <!-- Top-left: Player 1 (teal/primary) -->
    <rect x="430" y="140" width="270" height="220" rx="12" fill="url(#homeP1)" opacity="0.7"/>
    <rect x="430" y="140" width="270" height="220" rx="12" fill="none" stroke="#00c8ff" stroke-width="2" opacity="0.6"/>

    <!-- Top-right: Player 2 (red) -->
    <rect x="1260" y="140" width="270" height="220" rx="12" fill="url(#homeP2)" opacity="0.7"/>
    <rect x="1260" y="140" width="270" height="220" rx="12" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>

    <!-- Bottom-left: Player 3 (green) -->
    <rect x="430" y="720" width="270" height="200" rx="12" fill="url(#homeP3)" opacity="0.7"/>
    <rect x="430" y="720" width="270" height="200" rx="12" fill="none" stroke="#6bff9e" stroke-width="2" opacity="0.6"/>

    <!-- Bottom-right: Player 4 (gold) -->
    <rect x="1260" y="720" width="270" height="200" rx="12" fill="url(#homeP4)" opacity="0.7"/>
    <rect x="1260" y="720" width="270" height="200" rx="12" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>

    <!-- Track tiles along the path (64 positions, represented as grid cells) -->
    <!-- Top horizontal section -->
    <g fill="url(#trackTile)" stroke="#1e4a78" stroke-width="0.5" opacity="0.9">
      <!-- Top row of track -->
      <rect x="712" y="133" width="54" height="54" rx="4"/>
      <rect x="770" y="133" width="54" height="54" rx="4"/>
      <rect x="828" y="133" width="54" height="54" rx="4" fill="#009ccc" opacity="0.5"/>
      <rect x="886" y="133" width="54" height="54" rx="4"/>
      <rect x="944" y="133" width="54" height="54" rx="4"/>
      <rect x="1002" y="133" width="54" height="54" rx="4"/>
      <rect x="1060" y="133" width="54" height="54" rx="4" fill="#ff6b6b" opacity="0.4"/>
      <rect x="1118" y="133" width="54" height="54" rx="4"/>
      <rect x="1176" y="133" width="54" height="54" rx="4"/>

      <rect x="712" y="191" width="54" height="54" rx="4"/>
      <rect x="1176" y="191" width="54" height="54" rx="4"/>

      <rect x="712" y="249" width="54" height="54" rx="4"/>
      <rect x="1176" y="249" width="54" height="54" rx="4"/>

      <rect x="712" y="307" width="54" height="54" rx="4"/>
      <rect x="1176" y="307" width="54" height="54" rx="4"/>

      <!-- Left vertical section -->
      <rect x="420" y="373" width="54" height="54" rx="4"/>
      <rect x="420" y="431" width="54" height="54" rx="4"/>
      <rect x="420" y="489" width="54" height="54" rx="4"/>
      <rect x="420" y="547" width="54" height="54" rx="4"/>
      <rect x="420" y="605" width="54" height="54" rx="4"/>
      <rect x="420" y="663" width="54" height="54" rx="4"/>

      <rect x="478" y="373" width="54" height="54" rx="4"/>
      <rect x="478" y="663" width="54" height="54" rx="4"/>

      <rect x="536" y="373" width="54" height="54" rx="4"/>
      <rect x="536" y="663" width="54" height="54" rx="4"/>

      <rect x="594" y="373" width="54" height="54" rx="4" fill="#6bff9e" opacity="0.4"/>
      <rect x="594" y="663" width="54" height="54" rx="4"/>

      <!-- Right vertical section -->
      <rect x="1308" y="373" width="54" height="54" rx="4" fill="#ffd700" opacity="0.3"/>
      <rect x="1308" y="431" width="54" height="54" rx="4"/>
      <rect x="1308" y="489" width="54" height="54" rx="4"/>
      <rect x="1308" y="547" width="54" height="54" rx="4"/>
      <rect x="1308" y="605" width="54" height="54" rx="4"/>
      <rect x="1308" y="663" width="54" height="54" rx="4"/>

      <rect x="1366" y="373" width="54" height="54" rx="4"/>
      <rect x="1366" y="663" width="54" height="54" rx="4"/>

      <rect x="1424" y="373" width="54" height="54" rx="4"/>
      <rect x="1424" y="431" width="54" height="54" rx="4"/>
      <rect x="1424" y="489" width="54" height="54" rx="4"/>
      <rect x="1424" y="547" width="54" height="54" rx="4"/>
      <rect x="1424" y="605" width="54" height="54" rx="4"/>
      <rect x="1424" y="663" width="54" height="54" rx="4"/>

      <!-- Bottom row of track -->
      <rect x="712" y="717" width="54" height="54" rx="4"/>
      <rect x="712" y="775" width="54" height="54" rx="4"/>
      <rect x="712" y="833" width="54" height="54" rx="4"/>

      <rect x="770" y="833" width="54" height="54" rx="4"/>
      <rect x="828" y="833" width="54" height="54" rx="4" fill="#6bff9e" opacity="0.4"/>
      <rect x="886" y="833" width="54" height="54" rx="4"/>
      <rect x="944" y="833" width="54" height="54" rx="4"/>
      <rect x="1002" y="833" width="54" height="54" rx="4"/>
      <rect x="1060" y="833" width="54" height="54" rx="4" fill="#ffd700" opacity="0.3"/>
      <rect x="1118" y="833" width="54" height="54" rx="4"/>
      <rect x="1176" y="833" width="54" height="54" rx="4"/>
      <rect x="1176" y="775" width="54" height="54" rx="4"/>
      <rect x="1176" y="717" width="54" height="54" rx="4"/>
    </g>

    <!-- Finish run tiles (coloured safe paths into center) -->
    <!-- Player 1 finish (teal) - top center going down -->
    <g opacity="0.85">
      <rect x="770" y="373" width="54" height="54" rx="4" fill="#009ccc" opacity="0.6"/>
      <rect x="770" y="431" width="54" height="54" rx="4" fill="#009ccc" opacity="0.55"/>
      <rect x="770" y="489" width="54" height="54" rx="4" fill="#009ccc" opacity="0.5"/>
      <rect x="770" y="547" width="54" height="54" rx="4" fill="#009ccc" opacity="0.45"/>
      <rect x="770" y="605" width="54" height="54" rx="4" fill="#009ccc" opacity="0.4"/>
    </g>

    <!-- Player 2 finish (red) - right center going left -->
    <g opacity="0.85">
      <rect x="1060" y="373" width="54" height="54" rx="4" fill="#ff4444" opacity="0.6"/>
      <rect x="1002" y="373" width="54" height="54" rx="4" fill="#ff4444" opacity="0.55"/>
      <rect x="944" y="373" width="54" height="54" rx="4" fill="#ff4444" opacity="0.5"/>
      <rect x="886" y="373" width="54" height="54" rx="4" fill="#ff4444" opacity="0.45"/>
      <rect x="828" y="373" width="54" height="54" rx="4" fill="#ff4444" opacity="0.4"/>
    </g>

    <!-- Player 3 finish (green) - bottom going up -->
    <g opacity="0.85">
      <rect x="1118" y="663" width="54" height="54" rx="4" fill="#00cc66" opacity="0.6"/>
      <rect x="1118" y="605" width="54" height="54" rx="4" fill="#00cc66" opacity="0.55"/>
      <rect x="1118" y="547" width="54" height="54" rx="4" fill="#00cc66" opacity="0.5"/>
      <rect x="1118" y="489" width="54" height="54" rx="4" fill="#00cc66" opacity="0.45"/>
      <rect x="1118" y="431" width="54" height="54" rx="4" fill="#00cc66" opacity="0.4"/>
    </g>

    <!-- Player 4 finish (gold) - left going right -->
    <g opacity="0.85">
      <rect x="828" y="663" width="54" height="54" rx="4" fill="#ffcc00" opacity="0.6"/>
      <rect x="886" y="663" width="54" height="54" rx="4" fill="#ffcc00" opacity="0.55"/>
      <rect x="944" y="663" width="54" height="54" rx="4" fill="#ffcc00" opacity="0.5"/>
      <rect x="1002" y="663" width="54" height="54" rx="4" fill="#ffcc00" opacity="0.45"/>
      <rect x="1060" y="663" width="54" height="54" rx="4" fill="#ffcc00" opacity="0.4"/>
    </g>

    <!-- Center star/home tile -->
    <rect x="828" y="431" width="330" height="220" rx="12" fill="url(#centerGrad)" filter="url(#glow)"/>
    <rect x="828" y="431" width="330" height="220" rx="12" fill="none" stroke="#009ccc" stroke-width="2" opacity="0.7"/>

    <!-- Center star shape -->
    <polygon points="993,450 1000,490 1040,490 1007,513 1020,553 993,530 966,553 979,513 946,490 986,490"
             fill="#009ccc" opacity="0.6" filter="url(#glow)"/>

    <!-- Tile highlight overlays for depth -->
    <rect x="420" y="130" width="1120" height="800" rx="16" fill="url(#trackHighlight)"/>

    <!-- Board grid lines -->
    <g stroke="#1e4a78" stroke-width="0.5" opacity="0.4">
      <!-- Vertical lines across horizontal track -->
      <line x1="478" y1="373" x2="478" y2="717"/>
      <line x1="536" y1="373" x2="536" y2="717"/>
      <line x1="594" y1="373" x2="594" y2="717"/>
      <line x1="652" y1="373" x2="652" y2="717"/>
      <line x1="1308" y1="373" x2="1308" y2="717"/>
      <line x1="1366" y1="373" x2="1366" y2="717"/>
      <line x1="1424" y1="373" x2="1424" y2="717"/>
      <!-- Horizontal lines across vertical track -->
      <line x1="712" y1="191" x2="1230" y2="191"/>
      <line x1="712" y1="249" x2="1230" y2="249"/>
      <line x1="712" y1="307" x2="1230" y2="307"/>
    </g>

    <!-- Pawn placeholder circles on home tiles -->
    <!-- P1 pawns (teal) -->
    <circle cx="520" cy="200" r="22" fill="#009ccc" opacity="0.8" filter="url(#glow)"/>
    <circle cx="580" cy="200" r="22" fill="#009ccc" opacity="0.8" filter="url(#glow)"/>
    <circle cx="520" cy="260" r="22" fill="#009ccc" opacity="0.8" filter="url(#glow)"/>
    <circle cx="580" cy="260" r="22" fill="#009ccc" opacity="0.8" filter="url(#glow)"/>

    <!-- P2 pawns (red) -->
    <circle cx="1340" cy="200" r="22" fill="#ff4444" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1400" cy="200" r="22" fill="#ff4444" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1340" cy="260" r="22" fill="#ff4444" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1400" cy="260" r="22" fill="#ff4444" opacity="0.8" filter="url(#glow)"/>

    <!-- P3 pawns (green) -->
    <circle cx="520" cy="780" r="22" fill="#00cc66" opacity="0.8" filter="url(#glow)"/>
    <circle cx="580" cy="780" r="22" fill="#00cc66" opacity="0.8" filter="url(#glow)"/>
    <circle cx="520" cy="840" r="22" fill="#00cc66" opacity="0.8" filter="url(#glow)"/>
    <circle cx="580" cy="840" r="22" fill="#00cc66" opacity="0.8" filter="url(#glow)"/>

    <!-- P4 pawns (gold) -->
    <circle cx="1340" cy="780" r="22" fill="#ffcc00" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1400" cy="780" r="22" fill="#ffcc00" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1340" cy="840" r="22" fill="#ffcc00" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1400" cy="840" r="22" fill="#ffcc00" opacity="0.8" filter="url(#glow)"/>

    <!-- Board border glow -->
    <rect x="420" y="130" width="1120" height="800" rx="16" fill="none" stroke="#009ccc" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Foreground vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="50%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Top ambient glow for depth -->
  <ellipse cx="960" cy="0" rx="700" ry="200" fill="#009ccc" opacity="0.04"/>
</svg>
