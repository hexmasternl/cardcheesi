<div class="hud" [class.hud--expanded]="expanded()">

  <!-- Expand / collapse toggle -->
  <button class="hud__toggle" type="button" (click)="toggle()" [attr.aria-label]="expanded() ? 'Collapse HUD' : 'Expand HUD'">
    <i [class]="expanded() ? 'pi pi-chevron-down' : 'pi pi-chevron-up'"></i>
  </button>

  <!-- Main body -->
  <div class="hud__body">

    <!-- Contextual hint bar — always visible during the player's turn -->
    <div class="hud__hint" role="status" aria-live="polite">
      {{ turnFlow.helpText() }}
    </div>

    <!-- Cards fan + action buttons -->
    <div class="hud__main">

      <!-- Cards fan -->
      <div class="hud__cards">
        @for (card of cards(); track $index) {
          <app-playing-card
            [card]="card"
            [selected]="selectedIndex() === $index"
            [style]="cardStyle($index)"
            (click)="selectCard($index)"
          />
        }
      </div>

      <!-- Action buttons -->
      <div class="hud__actions">
        <button
          class="hud__btn hud__btn--play"
          [class.hud__btn--active]="turnFlow.canPlay()"
          [disabled]="!turnFlow.canPlay()"
          type="button"
          (click)="onPlay()"
        >
          <span class="hud__btn-label">Play Card</span>
        </button>
        <button
          class="hud__btn hud__btn--reset"
          [disabled]="!turnFlow.selectedCard()"
          type="button"
          (click)="onReset()"
        >
          <span class="hud__btn-label">Reset</span>
        </button>
        <button
          class="hud__btn hud__btn--dispose"
          [disabled]="!canDispose()"
          type="button"
          (click)="onDispose()"
        >
          <span class="hud__btn-label">Dispose</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Seven card: step count popup -->
  @if (turnFlow.showSevenPopup()) {
    <div class="hud__popup">
      <p class="hud__popup-label">How many steps for this pawn?</p>
      <div class="hud__popup-buttons">
        @for (n of sevenStepOptions; track n) {
          <button class="hud__popup-btn" type="button" (click)="onSelectSevenSteps(n)">{{ n }}</button>
        }
      </div>
    </div>
  }

  <!-- Ace card: enter or advance popup -->
  @if (turnFlow.showAcePopup()) {
    <div class="hud__popup">
      <p class="hud__popup-label">What do you want to do with the Ace?</p>
      <div class="hud__popup-buttons">
        <button class="hud__popup-btn hud__popup-btn--wide" type="button" (click)="onSelectAceChoice('enter')">
          Bring pawn into play
        </button>
        <button class="hud__popup-btn hud__popup-btn--wide" type="button" (click)="onSelectAceChoice('advance')">
          Move pawn 1 step
        </button>
      </div>
    </div>
  }

</div>
